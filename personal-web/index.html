    <div class="splash">
        <img src="intro.svg" alt="HAMHRR Intro" class="splash-image">       
    </div>

    <script>

        let introTimers = [];

        function playIntro() {

            const splash = document.querySelector('.splash');
            const heroEls = document.querySelectorAll('.menu, .planet, .center-line, .center-logo');

            if (!splash) return;

            introTimers.forEach(id => clearTimeout(id));
            introTimers = [];

            splash.style.transition = 'none';
            splash.style.display = 'flex';
            splash.classList.remove('fade-out');

            heroEls.forEach(el => { el.style.animation = 'none'; });

            void splash.offsetWidth;

            splash.style.transition = '';
            heroEls.forEach(el => { el.style.animation = ''; });

            introTimers.push(setTimeout(() => {
                splash.classList.add('fade-out');
            }, 500));

            introTimers.push(setTimeout(() => {
                splash.style.display = 'none';
            }, 2000));
        }

        window.addEventListener('pageshow', playIntro);

    </script>
