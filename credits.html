<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credits</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="credits.css">
    <link rel="icon" type="image/png" href="images/web head icon.png">
</head>
<body>

    <button class="return-btn" onclick="history.back()">
        <span class="arrow">v</span>
        <span class="text">RETURN</span>
    </button>

    <main class="page">

        <div class="background-main"></div>
        <div class="scene-overlay"></div>

        <section class="vibe-section">
            <h2 class="vibe-title">VIBECODED WITH</h2>
            <div class="vibe-logos">
                <img src="images/claude.png" alt="Claude" class="vibe-icon">
                <img src="images/gemini.png" alt="Gemini" class="vibe-icon">
                <img src="images/chatgpt.png" alt="ChatGPT" class="vibe-icon icon-chatgpt-neg">
            </div>
        </section>

        <section class="inspiration-section">
            <h2 class="inspiration-title">DESIGN INSPIRATIONS</h2>
            <div class="inspiration-logos">
                <img src="images/lonetrail only.png" alt="Lonetrail" class="inspiration-icon">
                <img src="images/one giant leap.png" alt="Arknights: One Giant Leap" class="inspiration-icon icon-onegiantleap">
                <img src="images/nasa.png" alt="NASA" class="inspiration-icon">
            </div>
        </section>

        <section class="thanks-section">
            <h2 class="thanks-title">SPECIAL THANKS TO</h2>
            <blockquote class="thanks-quote">
                <p>"Even though it's vibecoded, it's not bad for a non-IT"</p>
                <cite>&ndash; @fauzanrizkyn on github (ojan)</cite>
            </blockquote>
        </section>

    </main>

</body>
</html>
